name: 1 - Generate signing key (run ONCE)
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      PW: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Safety checks
        run: |
          if [ -f signing/callio-release.keystore.enc ]; then
            echo "A signing key already exists. Refusing to overwrite it (that would break updates for every installed phone)." >&2
            exit 1
          fi
          if [ -z "$PW" ] || [ ${#PW} -lt 16 ]; then
            echo "Add a repository secret named KEYSTORE_PASSWORD (16+ random characters) first: Settings > Secrets and variables > Actions." >&2
            exit 1
          fi
      - name: Create keystore and encrypt it with your password
        run: |
          mkdir -p signing
          keytool -genkeypair -storetype PKCS12 -keystore "$RUNNER_TEMP/callio.p12" -alias callio \
            -keyalg RSA -keysize 4096 -validity 36500 -storepass:env PW \
            -dname "CN=Callio, O=Callio, C=IN"
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in "$RUNNER_TEMP/callio.p12" \
            -out signing/callio-release.keystore.enc -pass env:PW
      - name: Commit encrypted key
        run: |
          git config user.name "callio-bot"
          git config user.email "callio-bot@users.noreply.github.com"
          git add signing/callio-release.keystore.enc
          git commit -m "Add encrypted release signing key"
          git push
